<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Nunito,'Segoe UI',Arial,sans-serif;background:#fbf4e3;color:#1F2A44}
.top{position:absolute;left:0;right:0;top:0;height:46px;background:#0E1C42;color:#f3d27a;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:800;font-size:17px;letter-spacing:.04em;z-index:5}.top b{color:#fff}
.site{position:absolute;inset:46px 0 0 0;display:none}.site svg{position:absolute;inset:0;width:100%;height:100%}
.site img{position:absolute;right:40px;bottom:0;height:88%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
.tag{position:absolute;background:#fffaf0;border:3px solid #8a6417;border-radius:12px;padding:8px 16px;font-size:36px;font-weight:900;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.who{position:absolute;left:24px;top:62px;z-index:6;background:rgba(14,28,66,.85);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:18px}
#scene{position:absolute;inset:46px 0 0 0}
.grid{position:absolute;left:170px;top:60px;width:940px;display:grid;grid-template-columns:56px repeat(4,1fr);gap:8px;background:#fff;border:3px solid #c9b48a;border-radius:16px;padding:12px}
.ch{position:relative;text-align:center;font-weight:900;font-size:22px;padding:10px 4px;border-radius:10px;border:3px solid transparent}
.cc{display:grid;place-items:center;font-weight:900;font-size:58px;border-radius:10px;height:84px;border:3px solid transparent}
.o{background:#eef0f4;color:#3a4256}.t{background:#f7ebc9;color:#6b4700}.h{background:#d7efe2;color:#155c39}.th{background:#fbe3ec;color:#8a2453}
.cc.blank{background:#fff;border:3px dashed #c9a35a}.cc.ghost{font-style:italic;opacity:.7}
.lab{display:flex;align-items:center;justify-content:flex-end;font-weight:900;font-size:22px;color:#5a3d0c;padding-right:8px}
.same{border-color:#1e8c5a!important}.ch.same::after{content:' ✓ same';font-size:15px;color:#1e7a4c}
.diff{border-color:#e8b923!important;box-shadow:0 0 0 5px #e8b923,0 0 20px 4px rgba(232,185,35,.5)}.ch.diff::after{content:' ★ decides';font-size:15px;color:#8a5a00}
.pt{position:absolute;right:-14px;top:50%;transform:translateY(-50%);font-size:46px;line-height:1}
.ptline{position:absolute;width:10px;border-radius:5px;background:#e8b923;box-shadow:0 0 16px 4px rgba(232,185,35,.7)}
.res{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:56px;font-weight:900}
.star{color:#e8b923;font-size:44px}
.nl{position:absolute;left:60px;top:80px;width:1160px;height:330px}
.cap{position:absolute;left:60px;right:60px;bottom:22px;min-height:70px;background:rgba(14,28,66,.92);color:#fff;border-radius:14px;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 20px;z-index:7}
</style></head><body>
<div class="top"><span><b>Lesson 5.09.03</b> · Comparing Decimals</span><span>Master Builders</span></div>
<div class="site" id="site"><svg></svg><img src="hemiunu-block.webp" alt=""><div class="tag" id="tag1" style="left:180px;top:250px">3.528 m</div><div class="tag" id="tag2" style="left:420px;top:350px">3.582 m</div></div>
<div id="scene"><div class="grid" id="grid"></div><div id="ptl" class="ptline"></div><svg class="nl" id="nl" viewBox="0 0 1160 330"></svg><div class="res" id="res"></div></div>
<div class="who" id="who">Hemiunu</div><div class="cap" id="cap"></div>
<script>
var TL=null, PL=['Ones','Tenths','Hundredths','Thousandths'], CL=['o','t','h','th'];
function rowsOf(nums){return nums.map(function(n){var p=n.split('.'),f=p[1]||'';return [p[0],f[0],f[1],f[2]];});}
function grid(nums,fill,chk,dec,labels,star){ if(!Array.isArray(dec))dec=[dec]; var isD=function(k){return dec.indexOf(k)>=0;};
  var R=rowsOf(nums), h='<div></div>'+PL.map(function(p,k){var c='ch '+CL[k]+(k<chk&&!isD(k)?' same':'')+(isD(k)&&chk>k?' diff':'');return '<div class="'+c+'">'+p+(k===0?'<b class="pt">•</b>':'')+'</div>';}).join('');
  R.forEach(function(r,i){h+='<div class="lab">'+(labels?labels[i]:'')+(star===i?'<span class="star">★</span>':'')+'</div>';for(var k=0;k<4;k++){var d=r[k],bl=d==null;var c='cc '+CL[k]+(bl&&!fill?' blank':'')+(bl&&fill?' ghost':'')+(k<chk&&!isD(k)?' same':'')+(isD(k)&&chk>k?' diff':'');h+='<div class="'+c+'">'+(bl?(fill?'0':''):d)+'</div>';}});
  var g=document.getElementById('grid'); if(g._h!==h){g.innerHTML=h;g._h=h;}
}
function nl(t,C){
  var s=document.getElementById('nl'),lo=3520,hi=3590,X0=40,W=1080,x=function(v){return X0+(v-lo)/(hi-lo)*W;},h='<line x1="'+X0+'" y1="200" x2="'+(X0+W)+'" y2="200" stroke="#3a2700" stroke-width="4"/>';
  for(var v=lo;v<=hi;v++){var b=v%10===0,m=v%5===0;h+='<line x1="'+x(v)+'" y1="'+(200-(b?30:m?18:10))+'" x2="'+x(v)+'" y2="'+(200+(b?30:m?18:10))+'" stroke="'+(b?'#3a2700':'#8a6417')+'" stroke-width="'+(b?4:2)+'"/>';if(b)h+='<text x="'+x(v)+'" y="270" text-anchor="middle" font-size="30" font-weight="900" fill="#3a2700">'+(v/1000).toFixed(2)+'</text>';}
  [[3528,'3.528','#b0336a',C.f1,90],[3582,'3.582','#1f3f8f',C.f2,90]].forEach(function(f){if(t<f[3])return;h+='<path d="M'+x(f[0])+' 192 l-14 -26 h28 z" fill="'+f[2]+'"/><text x="'+x(f[0])+'" y="'+f[4]+'" text-anchor="middle" font-size="40" font-weight="900" fill="'+f[2]+'">'+f[1]+'</text><line x1="'+x(f[0])+'" y1="100" x2="'+x(f[0])+'" y2="160" stroke="'+f[2]+'" stroke-width="2" stroke-dasharray="5 5"/>';});
  if(t>=C.arr)h+='<text x="'+(X0+W)+'" y="40" text-anchor="end" font-size="34" font-weight="900" fill="#1e7a4c">greater → farther right</text>';
  if(s._h!==h){s.innerHTML=h;s._h=h;}
}
function render(t){
  var C=TL.cue,S=TL.S,site=t<S.c1-0.3||t>=S.close-0.3,open=t<S.c1-0.3;
  document.getElementById('site').style.display=site?'block':'none';document.getElementById('scene').style.display=site?'none':'block';
  document.getElementById('tag1').style.display=document.getElementById('tag2').style.display=open?'block':'none';
  document.getElementById('who').textContent=site?'Hemiunu':'Claire';
  var c='';TL.cap.forEach(function(x){if(t>=x[0]-0.1)c=x[1];});if(t<TL.cap[0][0]-0.1)c='';
  var cp=document.getElementById('cap');cp.textContent=c;cp.style.visibility=c?'visible':'hidden';
  if(site)return;
  var g=document.getElementById('grid'),n=document.getElementById('nl'),r=document.getElementById('res'),pl=document.getElementById('ptl');
  var useNL=t>=S.c4-0.2&&t<C.ch5; n.style.display=useNL?'block':'none'; g.style.display=useNL?'none':'grid';
  pl.style.display='none'; r.innerHTML='';
  if(useNL){nl(t,C);return;}
  if(t<C.ch5){ var chk=t>=C.hund?3:t>=C.ten?2:t>=C.ones?1:0; grid(['3.528','3.582'],false,chk,2,['','']);
    if(t>=C.pt&&t<C.ones){var p=g.querySelector('.pt').getBoundingClientRect(),gr=g.getBoundingClientRect();pl.style.display='block';pl.style.left=(p.left+p.width/2-5)+'px';pl.style.top=(gr.top-46+8)+'px';pl.style.height=(gr.height-16)+'px';}
    if(t>=C.res1) r.innerHTML='3.528 <span style="color:#c0392b">&lt;</span> 3.582'; }
  else if(t<C.ch6){ var ch=t>=C.ten5?2:0; grid(['3.5','3.482'],t>=C.zero5,ch,1);
    if(t>=C.res5) r.innerHTML='3.5 <span style="color:#c0392b">&gt;</span> 3.482'; }
  else { var c6=t>=C.hund6?3:t>=C.ten6?2:0; grid(['3.06','3.6','3.006'],t>=C.zero6,c6,t>=C.hund6?[1,2]:[1],null,t>=C.star6?1:-1);
    if(t>=C.ord6) r.innerHTML='3.006 <span style="color:#c0392b">&lt;</span> 3.06 <span style="color:#c0392b">&lt;</span> 3.6'; }
  if(r.innerHTML){r.style.top=(g.offsetTop+g.offsetHeight+18)+'px';}
}
</script></body></html>
